name: Task-2 GitHub Actions CI/CD Pipeline

on:
  push:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPO: cloudshield-app

jobs:
  Build-Scan-Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v3

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: mvn compile
        run: mvn compile

      - name: validate
        run: mvn validate

      - name: Test
        run: mvn test

      - name: package
        run: mvn package -DskipTests

      - name: Unit Test / SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Krishnamohan2004_Java-Application \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Authenticate to AWS ECR
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build & Tag Container Image
        run: |
          docker build -t ${{ env.ECR_REPO }}:${{ github.sha }} .
          docker tag ${{ env.ECR_REPO }}:${{ github.sha }} ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_REPO }}:${{ github.sha }}

      - name: Docker Trivy Security Scan
        run: |
          curl -sfL https://githubusercontent.com | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_REPO }}:${{ github.sha }}

      - name: Push Image to AWS ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_REPO }}:${{ github.sha }}

      - name: Register ECS Task Definition and Deploy
        run: |
          aws ecs register-task-definition \
            --family cloudshield-task \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu "256" \
            --memory "512" \
            --container-definitions "[{\"name\":\"app\",\"image\":\"${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}://{{ env.ECR_REPO }}:${{ github.sha }}\",\"portMappings\":[{\"containerPort\":8080,\"hostPort\":8080}]}]"
